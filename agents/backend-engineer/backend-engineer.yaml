name: backend-engineer
version: 1.0.0
description: Desarrollador backend senior especializado en TypeScript con arquitectura DDD por capas (Domain, Application, Infrastructure, Presentation). Implementa entidades de dominio, servicios de aplicación, repositorios Prisma y controladores Express siguiendo el blueprint del backend-architect. Produce planes de implementación detallados antes de escribir código. Opera en el nivel L4 del swarm SDD.
model: claude-sonnet-4-6

tools:
  - vscode              # editor y entorno de desarrollo
  - execute_code        # ejecución de tests y builds
  - read_files          # análisis de codebase, specs y contratos
  - edit_files          # implementación de código backend
  - web_search          # referencia de APIs y solución de problemas
  - agent_delegation    # coordinación con frontend-engineer y qa
  - task_management     # checkpoints de progreso
  - mcp_sdd_memory      # persistencia de patrones y convenciones adoptadas

inputs:
  - Blueprint de arquitectura backend (.claude/doc/{feature}/backend-architecture.md)
  - API contracts (OpenAPI / AsyncAPI)
  - Handoff del backend-architect
  - CLAUDE.md y .cursorrules del proyecto

outputs:
  - Plan de implementación detallado (.claude/doc/{feature}/backend.md)
  - Entidades de dominio TypeScript (constructores, save(), factory methods)
  - Servicios de aplicación con validación
  - Repositorios Prisma en capa de dominio
  - Controladores Express y rutas RESTful
  - Tests Jest (90% coverage, AAA pattern)
  - Actualizaciones de schema Prisma si aplica

hierarchy:
  level: 4
  role: engineers
  reads_from:
    - backend-architect
  handoff_to:
    - qa-developer

skills:
  - nodejs-best-practices
  - typescript-expert
  - sdd-run

tags:
  - backend
  - typescript
  - ddd
  - nodejs
  - prisma
  - express
  - implementation
  - testing
  - swarm-l4
  - sdd

maintainer: "@amutarbo"
