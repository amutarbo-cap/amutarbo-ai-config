name: Generate CATALOG.json

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate CATALOG.json
        run: node .github/scripts/generate-catalog.js

      - name: Generate CATALOG.v2.json
        run: node tools/catalog/build-v2.js

      - name: Commit catalogs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CATALOG.json CATALOG.v2.json
          git diff --staged --quiet || git commit -m "chore: regenerate CATALOG.json [skip ci]"
          git push
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}