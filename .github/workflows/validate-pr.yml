name: Validate PR

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm init -y
          npm install js-yaml

      - name: Validate YAML files
        run: node .github/scripts/validate-yamls.js

      - name: Install root dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate skills
        run: node tools/validate/run.js